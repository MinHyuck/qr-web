<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>출석 QR</title>
<style>
body{font:16px 'Malgun Gothic',sans-serif;max-width:520px;margin:1.5em auto;padding:0 1em;color:#222}
body.wide{max-width:1000px}
input{width:100%;font-size:16px;padding:8px;box-sizing:border-box;margin:4px 0 10px}
button{font-size:16px;padding:8px 16px;margin:4px 0}
table{border-collapse:collapse}td,th{border:1px solid #bbb;padding:5px 8px}
.ok{background:#eefbee}.no{background:#fdeeee}#m,#s{white-space:pre-line}
</style></head><body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const API = 'https://script.google.com/macros/s/AKfycbxh0OyKcQuuKDMPtRfaKHj2bMvDmw6jkRLjE8jz2WGFuFfS9GY6f-B5ToQaQ79r_xw/exec';
const $ = id => document.getElementById(id), P = new URLSearchParams(location.search);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const call = o => fetch(API, { method: 'POST', body: JSON.stringify(o) }).then(r => r.json()); // text/plain 이라 CORS preflight 없음
const html = h => $('app').innerHTML = h;
const gps = (ok, fail) => navigator.geolocation.getCurrentPosition(ok, e => fail(e.message), { enableHighAccuracy: true, timeout: 15000 });

// ===== 휴대폰: 출석 =====
if (P.get('c')) {
  html('<h2>출석 체크</h2><p id="bn"></p><input id="n" placeholder="이름"><button onclick="go()">출석하기</button><p id="m"></p>');
  call({ a: 'branch', c: P.get('c'), t: P.get('t') }).then(j => $('bn').textContent = j.name || j.error).catch(() => $('bn').textContent = '서버 연결 실패');
  window.go = () => {
    const n = $('n').value.trim(); if (!n) return $('m').textContent = '이름을 입력하세요';
    $('m').textContent = '위치 확인 중...';
    gps(async p => {
      $('m').textContent = '출석 처리 중...';
      const j = await call({ a: 'checkin', b: P.get('c'), t: P.get('t'), name: n, lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }).catch(() => ({ error: '서버 연결 실패' }));
      $('m').textContent = j.msg || j.error;
    }, e => $('m').textContent = '위치 권한을 허용해주세요 (' + e + ')');
  };
}

// ===== 지점 담당자: 로그인 / QR / 주소변경 / 오늘 현황 =====
else if (P.has('m')) {
  const S = () => sessionStorage.getItem('s');
  const loginUI = () => { html('<h2>지점 로그인</h2><input id="i" placeholder="ID"><input id="p" type="password" placeholder="비밀번호"><button onclick="login()">로그인</button> <span id="m"></span>');
    window.login = async () => { $('m').textContent = '확인 중...'; const j = await call({ a: 'login', id: $('i').value, pw: $('p').value }); if (j.session) { sessionStorage.setItem('s', j.session); manageUI(); } else $('m').textContent = j.error; }; };
  let lastTok = '', timer;
  const manageUI = () => {
    html('<h2 id="t"></h2><p id="v"></p><div id="qr" style="margin:10px 0"></div><p id="u" style="word-break:break-all;font-size:12px"></p><hr><b>교육장 주소 변경</b> <small>(교육장에서 노트북으로 변경해야 합니다)</small><input id="a"><b>허용 반경(m)</b><input id="r" type="number"><button onclick="saveV()">저장</button> <span id="s"></span><h3>오늘 출석 현황</h3><div id="rows"></div><p><a href="#" onclick="logout();return false">로그아웃</a></p>');
    lastTok = ''; load(); clearInterval(timer); timer = setInterval(load, 10000);
  };
  window.logout = () => { sessionStorage.removeItem('s'); clearInterval(timer); loginUI(); };
  async function load() {
    const j = await call({ a: 'my', s: S() }).catch(() => ({ error: 'net' })); if (j.error === 'login') return logout(); if (j.error) return;
    $('t').textContent = j.name + ' 출석 QR'; $('v').innerHTML = '교육장: <b>' + esc(j.roadAddress) + '</b> (반경 ' + j.radius + 'm)';
    const url = location.origin + location.pathname + '?c=' + j.id + '&t=' + j.token;
    if (j.token !== lastTok) { lastTok = j.token; $('qr').innerHTML = ''; new QRCode($('qr'), { text: url, width: 260, height: 260 }); $('u').textContent = url; }
    if (!$('a').value) { $('a').value = j.address; $('r').value = j.radius; }
    $('rows').innerHTML = '<table>' + j.rows.map(x => '<tr class="' + (x.final === 'O' ? 'ok' : 'no') + '"><td>' + esc(String(x.ts).slice(11)) + '</td><td>' + esc(x.name) + '</td><td>' + (x.final === 'O' ? '출석' : '실패') + '</td><td>' + esc(x.dist) + 'm</td></tr>').join('') + '</table>';
  }
  window.saveV = () => {
    $('s').textContent = '내 위치 확인 중...';
    gps(async p => { $('s').textContent = '확인 중...'; const j = await call({ a: 'myvenue', s: S(), address: $('a').value, radius: $('r').value, lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy });
      $('s').textContent = j.ok ? '저장됨' : (j.msg || j.error); lastTok = ''; load(); }, e => $('s').textContent = '위치 권한을 허용해야 주소를 바꿀 수 있습니다 (' + e + ')');
  };
  S() ? manageUI() : loginUI();
}

// ===== 고객사: 실시간 / 날짜별 조회 =====
else if (P.get('v')) {
  document.body.className = 'wide';
  const today = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
  let rows = [], bid = '';
  html('<h2 id="h"></h2><p id="sum"></p><p>날짜 <input id="d" type="date" style="width:auto;margin:0" value="' + today + '" onchange="load()"> <button onclick="csv()">엑셀(CSV) 다운로드</button> <small style="color:#666">· 10초마다 자동 갱신</small></p><div id="tb"></div>');
  window.load = async () => {
    const j = await call({ a: 'view', k: P.get('v'), d: $('d').value }).catch(() => ({ error: '서버 연결 실패' })); if (j.error) return $('h').textContent = j.error;
    rows = j.rows; const ok = n => new Set(rows.filter(r => r.bid === n && r.final === 'O').map(r => r.name)).size;
    $('h').textContent = j.day + ' 출석 현황';
    $('sum').innerHTML = j.branches.map(b => '<a href="#" onclick="sb(\'' + b.id + '\');return false">' + esc(b.name) + ' <b>' + ok(b.id) + '명</b></a>').join(' · ') + ' · <a href="#" onclick="sb(\'\');return false">전체</a>';
    draw();
  };
  window.sb = id => { bid = id; draw(); };
  window.draw = () => { $('tb').innerHTML = '<table><tr>' + ['시각', '지점', '이름', '결과', '거리(m)', '등록 교육장', '확인된 주소'].map(h => '<th>' + h + '</th>').join('') + '</tr>' +
    rows.filter(r => !bid || r.bid === bid).map(r => '<tr class="' + (r.final === 'O' ? 'ok' : 'no') + '"><td>' + esc(String(r.ts).slice(11)) + '</td><td>' + esc(r.branch) + '</td><td>' + esc(r.name) + '</td><td>' + (r.final === 'O' ? '출석' : '실패') + '</td><td>' + esc(r.dist) + '</td><td>' + esc(r.venue) + '</td><td>' + esc(r.gps) + '</td></tr>').join('') + '</table>'; };
  window.csv = () => { const q = s => '"' + String(s ?? '').replace(/"/g, '""') + '"';
    const t = '﻿일시,지점,이름,결과,거리(m),등록 교육장,확인된 주소\r\n' + rows.map(r => [r.ts, r.branch, r.name, r.final === 'O' ? '출석' : '실패', r.dist, r.venue, r.gps].map(q).join(',')).join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([t], { type: 'text/csv;charset=utf-8' })); a.download = 'attendance_' + $('d').value + '.csv'; a.click(); };
  load(); setInterval(load, 10000);
}

else html('<h2>출석 QR</h2><p>QR을 스캔해서 접속해주세요.</p>');
</script></body></html>
